name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8 (code quality check)
        run: |
          flake8 src/ tests/ --max-line-length=120 --exit-zero

      - name: Run unit tests (Pytest)
        run: |
          pytest tests/test_data_loader.py tests/test_preprocessing.py -v

      - name: Run training smoke test
        run: |
          pytest tests/test_train_smoke.py -v

      - name: Run model training and evaluation (quality gate)
        run: |
          python src/ci_quality_gate.py

      - name: Report workflow outcome
        if: always()
        run: |
          echo "CI workflow finished with status: ${{ job.status }}"